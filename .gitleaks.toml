# gitleaks config (CI: .github/workflows/gitleaks.yml, local: .githooks/pre-commit).
[extend]
useDefault = true

[allowlist]
description = "Firebase client config: its API key ships in every APK and is restricted in the Firebase console"
paths = [
  '''android/app/google-services\.json''',
  '''ios/Runner/GoogleService-Info\.plist''',
]
