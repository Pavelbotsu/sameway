name: sameway
description: "Rideshare app — connect drivers and passengers in real time."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_map: ^8.3.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  latlong2: ^0.9.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  skeletonizer: ^2.1.3
  package_info_plus: ^8.0.0
  device_info_plus: ^11.0.0
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.0
  share_plus: ^10.0.0
  image_picker: ^1.1.0
  flutter_local_notifications: ^18.0.0
  firebase_crashlytics: ^4.3.10
  firebase_analytics: ^11.6.0
  firebase_performance: ^0.10.1+10
  firebase_remote_config: ^5.5.0
  flutter_foreground_task: ^9.2.2
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
