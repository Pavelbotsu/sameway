name: sameway
description: "Rideshare app — connect drivers and passengers in real time."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_map: ^8.3.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  latlong2: ^0.9.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
