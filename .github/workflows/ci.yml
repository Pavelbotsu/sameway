# App CI: static analysis and unit/widget tests. The on-emulator integration
# test (integration_test/) needs the local backend and runs by hand — see
# RELEASE_SETUP.md.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true
      - run: flutter pub get
      # lib/l10n/gen is not committed. Every key must exist in en, uk and pl:
      # gen-l10n lists missing translations in build/l10n_untranslated.json.
      - run: flutter gen-l10n
      - name: No untranslated messages
        run: |
          cat build/l10n_untranslated.json
          test "$(tr -d '[:space:]' < build/l10n_untranslated.json)" = "{}"
      - run: flutter analyze
      # Goldens are rendered on Windows and differ by a few pixels on Linux;
      # they run locally: flutter test --tags golden
      # test/l10n checks the copy rules and that no widget hard-codes a string.
      - run: flutter test --exclude-tags golden

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
